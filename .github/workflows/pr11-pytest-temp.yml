name: PR11 Pytest Temp

on:
  push:
    branches:
      - fix/explicit-workspace-namespace
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest chromadb pythainlp requests mcp

      - name: Start mock Ollama API
        run: |
          cat > /tmp/mock_ollama.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *args):
                  pass

              def do_GET(self):
                  if self.path == '/api/tags':
                      body = json.dumps({'models': []}).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  self.send_response(404)
                  self.end_headers()

              def do_POST(self):
                  if self.path == '/api/embeddings':
                      length = int(self.headers.get('Content-Length', '0'))
                      if length:
                          self.rfile.read(length)
                      body = json.dumps({'embedding': [0.0] * 768}).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  self.send_response(404)
                  self.end_headers()

          ThreadingHTTPServer(('127.0.0.1', 11434), Handler).serve_forever()
          PY
          python /tmp/mock_ollama.py >/tmp/mock_ollama.log 2>&1 &
          echo $! >/tmp/mock_ollama.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null

      - name: Run pytest
        run: python -m pytest -q
