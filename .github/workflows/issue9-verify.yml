name: Issue 9 Packaging Verification

on:
  push:
    branches:
      - fix/issue-9-packaging-hermetic

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and hermetic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install build

      - name: Run hermetic unit suite
        run: python -m pytest -q

      - name: Build wheel and verify clean standalone install
        run: |
          python -m build
          python -m venv /tmp/thai-rag-clean
          /tmp/thai-rag-clean/bin/python -m pip install --upgrade pip
          /tmp/thai-rag-clean/bin/python -m pip install dist/*.whl
          THAI_RAG_CACHE_DIR=/tmp/thai-rag-help-cache /tmp/thai-rag-clean/bin/thai-rag-mcp --help
          test ! -e /tmp/thai-rag-help-cache
          /tmp/thai-rag-clean/bin/python -c "import thai_rag; import thai_rag.cli"
          THAI_RAG_CACHE_DIR=/tmp/thai-rag-stdio-cache /tmp/thai-rag-clean/bin/python - <<'PY'
          import os
          import subprocess
          import time

          env = os.environ.copy()
          proc = subprocess.Popen(
              ["/tmp/thai-rag-clean/bin/thai-rag-mcp", "--stdio"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              env=env,
          )
          time.sleep(1.0)
          code = proc.poll()
          if code not in (None, 0):
              stdout, stderr = proc.communicate(timeout=2)
              raise SystemExit(f"stdio startup failed ({code})\nstdout:\n{stdout}\nstderr:\n{stderr}")
          if code is None:
              proc.terminate()
              try:
                  proc.wait(timeout=3)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=3)
          PY

      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain)"
