name: Goal runtime reconciliation gate

on:
  pull_request:
    paths:
      - ".github/workflows/goal-runtime-reconciliation.yml"
      - "apps/cli/package.json"
      - "apps/cli/src/runtime/stdio-mcp-runtime.ts"
      - "apps/cli/src/runtime/stdio-mcp-runtime.test.ts"
      - "packages/application/src/goal-continuation-service.ts"
      - "packages/application/src/goal-continuation-runtime-events.integration.test.ts"
      - "packages/application/src/goal-mutation-fence-service.ts"
      - "packages/application/src/goal-mutation-fence-service.test.ts"
      - "packages/application/src/goal-runtime-control-plane-service.ts"
      - "packages/application/src/goal-runtime-control-plane-service.test.ts"
      - "packages/application/src/goal-workspace-truth-reader.ts"
      - "packages/application/src/goal-workspace-truth-reader.test.ts"
      - "packages/application/src/goal-runtime-reconciliation-service.ts"
      - "packages/application/src/goal-runtime-reconciliation-service.test.ts"
      - "packages/application/src/index.ts"
      - "packages/domain/src/goal-runtime-event.ts"
      - "packages/domain/src/goal-runtime-projector.ts"
      - "packages/domain/src/goal-runtime-projector.test.ts"
      - "packages/storage/src/database.ts"
      - "packages/storage/src/goal-runtime-event-repository.ts"
      - "packages/storage/src/goal-runtime-event-repository.test.ts"
      - "packages/storage/src/goal-runtime-snapshot-repository.test.ts"
      - "packages/storage/src/migrations/goal-runtime-workspace-observation-migration.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goal-runtime-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build CLI dependency closure
        run: pnpm --filter @unified-mpc/cli build

      - name: Domain runtime projection regression
        run: >-
          pnpm --filter @unified-mpc/domain exec vitest run
          src/goal-runtime-projector.test.ts

      - name: Storage reconciliation regression
        run: >-
          pnpm --filter @unified-mpc/storage exec vitest run --fileParallelism=false
          src/goal-runtime-event-repository.test.ts
          src/goal-runtime-snapshot-repository.test.ts

      - name: Application runtime producer and restart reconciliation
        run: >-
          pnpm --filter @unified-mpc/application exec vitest run
          src/goal-runtime-control-plane-service.test.ts
          src/goal-workspace-truth-reader.test.ts
          src/goal-continuation-runtime-events.integration.test.ts
          src/goal-mutation-fence-service.test.ts
          src/goal-runtime-reconciliation-service.test.ts

      - name: STDIO runtime regression
        run: pnpm --filter @unified-mpc/cli exec vitest run src/runtime/stdio-mcp-runtime.test.ts

      - name: Targeted typecheck
        run: |
          pnpm --filter @unified-mpc/storage typecheck
          pnpm --filter @unified-mpc/application typecheck
          pnpm --filter @unified-mpc/cli typecheck

      - name: Targeted ESLint
        run: >-
          pnpm exec eslint
          packages/storage/src/database.ts
          packages/storage/src/goal-runtime-event-repository.ts
          packages/storage/src/goal-runtime-event-repository.test.ts
          packages/storage/src/goal-runtime-snapshot-repository.test.ts
          packages/storage/src/migrations/goal-runtime-workspace-observation-migration.ts
          packages/application/src/goal-continuation-service.ts
          packages/application/src/goal-continuation-runtime-events.integration.test.ts
          packages/application/src/goal-mutation-fence-service.ts
          packages/application/src/goal-mutation-fence-service.test.ts
          packages/application/src/goal-runtime-control-plane-service.ts
          packages/application/src/goal-runtime-control-plane-service.test.ts
          packages/application/src/goal-workspace-truth-reader.ts
          packages/application/src/goal-workspace-truth-reader.test.ts
          packages/application/src/goal-runtime-reconciliation-service.ts
          packages/application/src/goal-runtime-reconciliation-service.test.ts
          packages/application/src/index.ts
          packages/domain/src/goal-runtime-event.ts
          packages/domain/src/goal-runtime-projector.ts
          packages/domain/src/goal-runtime-projector.test.ts
          apps/cli/src/runtime/stdio-mcp-runtime.ts
          apps/cli/src/runtime/stdio-mcp-runtime.test.ts

