name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ubuntu-ci:
    name: Linux Ubuntu CI (Node 22)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck all 21 packages
        shell: bash
        run: corepack pnpm typecheck

      - name: Run lint
        shell: bash
        run: corepack pnpm lint

      - name: Run package test suites
        shell: bash
        run: corepack pnpm test

      - name: Run root integration test suites
        shell: bash
        run: npx vitest run tests/

      - name: Build all packages
        shell: bash
        run: corepack pnpm build

      - name: Verify CLI binary execution
        shell: bash
        run: |
          node apps/cli/dist/index.js --help
          node apps/cli/dist/index.js status

      - name: Test Linux native host (Rust)
        shell: bash
        run: cargo test --manifest-path native/linux-host/Cargo.toml --locked
