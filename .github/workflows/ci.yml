name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile smoke
        run: python -m compileall -q thai_rag tests

      - name: Hermetic unit suite
        run: python -m pytest -q

  package-smoke:
    name: package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel into fresh venv
        run: |
          python -m venv /tmp/thai-rag-clean
          /tmp/thai-rag-clean/bin/python -m pip install --upgrade pip
          /tmp/thai-rag-clean/bin/python -m pip install dist/*.whl

      - name: Import and CLI help smoke
        run: |
          /tmp/thai-rag-clean/bin/python -c "import thai_rag; import thai_rag.cli"
          THAI_RAG_CACHE_DIR=/tmp/thai-rag-help-cache /tmp/thai-rag-clean/bin/thai-rag-mcp --help
          test ! -e /tmp/thai-rag-help-cache

      - name: Standalone stdio startup smoke
        env:
          THAI_RAG_CACHE_DIR: /tmp/thai-rag-stdio-cache
        run: |
          /tmp/thai-rag-clean/bin/python - <<'PY'
          import os
          import subprocess
          import time

          proc = subprocess.Popen(
              ["/tmp/thai-rag-clean/bin/thai-rag-mcp", "--stdio"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              env=os.environ.copy(),
          )
          time.sleep(1.0)
          code = proc.poll()
          if code not in (None, 0):
              stdout, stderr = proc.communicate(timeout=2)
              raise SystemExit(
                  f"stdio startup failed ({code})\nstdout:\n{stdout}\nstderr:\n{stderr}"
              )
          if code is None:
              proc.terminate()
              try:
                  proc.wait(timeout=3)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=3)
          PY

  schema-regression:
    name: schema-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Storage and workspace migration regressions
        run: |
          python -m pytest -q \
            tests/test_storage.py \
            tests/test_retriever.py \
            tests/test_conversational_memory.py

  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject generated runtime/package artifacts
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = []
          blocked_suffixes = (".db", ".sqlite", ".sqlite3", ".db-wal", ".db-shm", ".sock")
          blocked_parts = {".cache", "chroma", "dist", "build", "__pycache__"}

          for raw in tracked:
              path = PurePosixPath(raw)
              if path.name.endswith(blocked_suffixes):
                  bad.append(raw)
                  continue
              if any(part in blocked_parts or part.endswith(".egg-info") for part in path.parts):
                  bad.append(raw)

          if bad:
              raise SystemExit("Generated/runtime artifacts are tracked:\n" + "\n".join(bad))
          PY
