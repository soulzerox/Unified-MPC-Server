name: Runtime root safety gate

on:
  pull_request:
    paths:
      - "scripts/validate-runtime-root.sh"
      - "scripts/validate-runtime-root.test.sh"
      - "scripts/launch-runtime.sh"
      - "scripts/launch-runtime.test.sh"
      - "scripts/unified-mpc-mcp-http.service"
      - "scripts/unified-mpc-web.service"
      - "scripts/unified-mpc.service.env.example"
      - "docs/DEPLOYMENT_LINUX.md"
      - ".github/workflows/runtime-root-safety.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/validate-runtime-root.sh"
      - "scripts/validate-runtime-root.test.sh"
      - "scripts/launch-runtime.sh"
      - "scripts/launch-runtime.test.sh"
      - "scripts/unified-mpc-mcp-http.service"
      - "scripts/unified-mpc-web.service"
      - "scripts/unified-mpc.service.env.example"
      - "docs/DEPLOYMENT_LINUX.md"
      - ".github/workflows/runtime-root-safety.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate shell syntax
        run: |
          bash -n scripts/validate-runtime-root.sh
          bash -n scripts/validate-runtime-root.test.sh
          bash -n scripts/launch-runtime.sh
          bash -n scripts/launch-runtime.test.sh

      - name: Runtime root regression
        run: bash scripts/validate-runtime-root.test.sh

      - name: Runtime startup reconciliation regression
        run: bash scripts/launch-runtime.test.sh

      - name: Verify systemd units
        run: |
          systemd-analyze verify \
            scripts/unified-mpc.service \
            scripts/unified-mpc-mcp-http.service \
            scripts/unified-mpc-web.service

      - name: Verify stable startup reconciler wiring
        run: |
          grep -Fq '/usr/bin/bash %h/.config/unified-mpc/launch-runtime.sh mcp-http' scripts/unified-mpc-mcp-http.service
          grep -Fq '/usr/bin/bash %h/.config/unified-mpc/launch-runtime.sh web' scripts/unified-mpc-web.service
          grep -Fq 'RestartPreventExitStatus=78' scripts/unified-mpc-mcp-http.service
          grep -Fq 'RestartPreventExitStatus=78' scripts/unified-mpc-web.service
