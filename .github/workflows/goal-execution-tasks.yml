name: Goal execution tasks gate

on:
  pull_request:
    paths:
      - ".github/workflows/goal-execution-tasks.yml"
      - "apps/cli/src/runtime/stdio-mcp-runtime.ts"
      - "packages/application/src/agent-swarm-service.ts"
      - "packages/application/src/agent-swarm-service.test.ts"
      - "packages/application/src/goal-continuation-service.ts"
      - "packages/application/src/goal-task-cancellation-service.ts"
      - "packages/application/src/goal-task-cancellation-service.test.ts"
      - "packages/application/src/goal-runtime-reconciliation-service.ts"
      - "packages/application/src/scheduled-continuation-service.ts"
      - "packages/domain/src/goal-continuation.ts"
      - "packages/domain/src/goal-runtime.ts"
      - "packages/process/src/process-recovery.ts"
      - "packages/process/src/process-recovery.test.ts"
      - "packages/process/src/process-manager.ts"
      - "packages/process/src/process-manager.test.ts"
      - "packages/process/src/process-types.ts"
      - "packages/codex/src/codex-adapter.ts"
      - "packages/codex/src/codex-adapter.test.ts"
      - "packages/application/src/process-service.ts"
      - "packages/application/src/process-service.test.ts"
      - "packages/application/src/codex-service.ts"
      - "packages/application/src/codex-service.test.ts"
      - "packages/mcp-server/src/goal-managed-task-state-reader.ts"
      - "packages/mcp-server/src/goal-managed-task-state-reader.test.ts"
      - "packages/mcp-server/src/goal-process-admission.ts"
      - "packages/mcp-server/src/goal-process-admission.integration.test.ts"
      - "packages/mcp-server/src/modern-tasks-protocol.ts"
      - "packages/mcp-server/src/modern-tasks-goal.test.ts"
      - "packages/mcp-server/src/scheduled-continuation-fence.test.ts"
      - "packages/mcp-server/src/tool-registry.ts"
      - "packages/mcp-server/src/modern-tasks.integration.test.ts"
      - "packages/mcp-server/src/tools/goal-tools.ts"
      - "packages/mcp-server/src/tools/tool-types.ts"
      - "packages/storage/src/agent-swarm-repository.ts"
      - "packages/storage/src/goal-continuation.integration.test.ts"
      - "packages/storage/src/goal-repository.ts"
      - "packages/storage/src/goal-restart-reconnect.integration.test.ts"
      - "packages/storage/src/goal-scheduled-execution-ownership.integration.test.ts"
      - "packages/storage/src/goal-runtime-event-repository.ts"
      - "packages/storage/src/goal-runtime-snapshot-repository.ts"
      - "packages/workspace/src/resource-admission.ts"
      - "packages/workspace/src/resource-admission.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goal-execution-tasks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build CLI dependency closure
        run: pnpm --filter @unified-mpc/cli^... build

      - name: Durable execution restart/reconnect regression
        run: >-
          pnpm --filter @unified-mpc/storage exec vitest run --fileParallelism=false
          src/goal-continuation.integration.test.ts
          src/goal-restart-reconnect.integration.test.ts
          src/goal-scheduled-execution-ownership.integration.test.ts

      - name: Managed process restart identity contract
        run: >-
          pnpm --filter @unified-mpc/process exec vitest run --fileParallelism=false
          src/process-recovery.test.ts
          src/process-manager.test.ts

      - name: Recovery identity service plumbing
        run: |
          pnpm --filter @unified-mpc/codex exec vitest run --fileParallelism=false src/codex-adapter.test.ts
          pnpm --filter @unified-mpc/application exec vitest run --fileParallelism=false src/process-service.test.ts src/codex-service.test.ts

      - name: Goal resource admission contract
        run: pnpm --filter @unified-mpc/workspace exec vitest run --fileParallelism=false src/resource-admission.test.ts

      - name: Goal-tracked delegated swarm ownership
        run: >-
          pnpm --filter @unified-mpc/application exec vitest run --fileParallelism=false
          src/agent-swarm-service.test.ts
          src/goal-task-cancellation-service.test.ts

      - name: Goal-backed MCP Tasks, parent-abort, and process-lifetime regression
        run: >-
          pnpm --filter @unified-mpc/mcp-server exec vitest run --fileParallelism=false
          src/modern-tasks-goal.test.ts
          src/modern-tasks.integration.test.ts
          src/scheduled-continuation-fence.test.ts
          src/goal-process-admission.integration.test.ts
          src/goal-managed-task-state-reader.test.ts

      - name: Targeted typecheck
        run: |
          pnpm --filter @unified-mpc/domain typecheck
          pnpm --filter @unified-mpc/process typecheck
          pnpm --filter @unified-mpc/codex typecheck
          pnpm --filter @unified-mpc/workspace typecheck
          pnpm --filter @unified-mpc/storage typecheck
          pnpm --filter @unified-mpc/application typecheck
          pnpm --filter @unified-mpc/mcp-server typecheck
          pnpm --filter @unified-mpc/cli typecheck

      - name: Targeted ESLint
        run: >-
          pnpm exec eslint
          packages/domain/src/goal-continuation.ts
          packages/process/src/process-recovery.ts
          packages/process/src/process-recovery.test.ts
          packages/process/src/process-manager.ts
          packages/process/src/process-manager.test.ts
          packages/process/src/process-types.ts
          packages/codex/src/codex-adapter.ts
          packages/codex/src/codex-adapter.test.ts
          packages/application/src/process-service.ts
          packages/application/src/process-service.test.ts
          packages/application/src/codex-service.ts
          packages/application/src/codex-service.test.ts
          packages/storage/src/goal-repository.ts
          packages/storage/src/goal-continuation.integration.test.ts
          packages/storage/src/goal-restart-reconnect.integration.test.ts
          packages/storage/src/goal-scheduled-execution-ownership.integration.test.ts
          packages/application/src/agent-swarm-service.ts
          packages/application/src/agent-swarm-service.test.ts
          packages/application/src/goal-continuation-service.ts
          packages/application/src/goal-task-cancellation-service.ts
          packages/application/src/goal-task-cancellation-service.test.ts
          packages/application/src/scheduled-continuation-service.ts
          packages/application/src/goal-runtime-reconciliation-service.ts
          packages/workspace/src/resource-admission.ts
          packages/workspace/src/resource-admission.test.ts
          packages/mcp-server/src/goal-managed-task-state-reader.ts
          packages/mcp-server/src/goal-managed-task-state-reader.test.ts
          packages/mcp-server/src/goal-process-admission.ts
          packages/mcp-server/src/goal-process-admission.integration.test.ts
          packages/mcp-server/src/modern-tasks-protocol.ts
          packages/mcp-server/src/modern-tasks-goal.test.ts
          packages/mcp-server/src/scheduled-continuation-fence.test.ts
          packages/mcp-server/src/tool-registry.ts
          packages/mcp-server/src/tools/goal-tools.ts
          packages/mcp-server/src/tools/tool-types.ts
          packages/storage/src/agent-swarm-repository.ts
          apps/cli/src/runtime/stdio-mcp-runtime.ts
